name: CI

# The default-branch ruleset requires three checks, named `lint`, `build` and
# `test`, as in every Kaiten SDK repository. Each job below reports one of them.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1.26.x here, while build and test stay on the 1.25.x go.mod declares.
      # setup-go reads the go directive as an exact patch, which would pin the
      # Vulnerability scan below to the stdlib as it shipped in that patch, so
      # the jobs name a minor version and take its newest patch instead. This
      # job goes one minor further because 1.25 left support when 1.27
      # shipped: its stdlib advisories are fixed in 1.26 and later only, and
      # its final patch would fail the scan on every run whatever the change.
      # A consumer builds with its own toolchain, so the scan has to run on one
      # that is still patched. go.mod stays the language-version contract, and
      # the build and test jobs keep proving that floor. check-latest, because
      # without it setup-go takes the newest 1.26 the runner already caches,
      # which can be a patch behind the one that fixes what the scan reports.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      # The AI usage normalisers are modules of their own, so that the root module
      # never depends on a provider SDK, and ./... stops at a nested module.
      - name: golangci-lint (ai/openai)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ai/openai
          args: --timeout=5m ./...

      - name: golangci-lint (ai/anthropic)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ai/anthropic
          args: --timeout=5m ./...

      - name: Verify module metadata
        run: |
          for module in . ai/openai ai/anthropic; do
            (cd "$module" && go mod tidy)
          done
          git diff --exit-code -- go.mod go.sum ai/openai/go.mod ai/openai/go.sum ai/anthropic/go.mod ai/anthropic/go.sum

      # This module is published, so a vulnerable dependency ships to every
      # consumer. govulncheck reports only the advisories whose vulnerable
      # symbols this code actually reaches, so a finding here is real work
      # rather than a CVE in a function nothing calls.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Build
        run: |
          go build -v ./...
          (cd ai/openai && go build -v ./...)
          (cd ai/anthropic && go build -v ./...)

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Test
        run: |
          go test -race -shuffle=on -cover ./...
          (cd ai/openai && go test -race -shuffle=on -cover ./...)
          (cd ai/anthropic && go test -race -shuffle=on -cover ./...)

      # Each normaliser declares the oldest provider SDK of its major version that it
      # supports, and the step above tests that floor. This one tests the newest
      # release of the same major, so a provider renaming a usage field is caught
      # here rather than by a consumer. The go.mod changes it makes are not kept.
      - name: Test the AI normalisers against the newest provider SDKs
        run: |
          (cd ai/openai && go get github.com/openai/openai-go/v3@latest && go test -race ./...)
          (cd ai/anthropic && go get github.com/anthropics/anthropic-sdk-go@latest && go test -race ./...)
