name: CI

# The default-branch ruleset requires three checks, named `lint`, `build` and
# `test`, as in every Kaiten SDK repository. Each job below reports one of them.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # 1.26.x here, while build and test stay on the 1.25.x go.mod declares.
      # setup-go reads the go directive as an exact patch, which would pin the
      # Vulnerability scan below to the stdlib as it shipped in that patch, so
      # the jobs name a minor version and take its newest patch instead. This
      # job goes one minor further because 1.25 left support when 1.27
      # shipped: its stdlib advisories are fixed in 1.26 and later only, and
      # its final patch would fail the scan on every run whatever the change.
      # A consumer builds with its own toolchain, so the scan has to run on one
      # that is still patched. go.mod stays the language-version contract, and
      # the build and test jobs keep proving that floor. check-latest, because
      # without it setup-go takes the newest 1.26 the runner already caches,
      # which can be a patch behind the one that fixes what the scan reports.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Verify module metadata
        run: go mod tidy && git diff --exit-code -- go.mod go.sum

      # This module is published, so a vulnerable dependency ships to every
      # consumer. govulncheck reports only the advisories whose vulnerable
      # symbols this code actually reaches, so a finding here is real work
      # rather than a CVE in a function nothing calls.
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Build
        run: go build -v ./...

  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: go.sum

      - name: Test
        run: go test -race -shuffle=on -cover ./...

      - name: Verify management-only generator policy
        run: |
          set -eu
          go test ./internal/gen -run TestNoDirectFlagEvaluationExports
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          # Config output wins over -o; omit only the output path in this temp copy.
          sed '/^output:/d' oapi-codegen.cfg.yaml > "$tmp/config.yaml"
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 --config "$tmp/config.yaml" -o "$tmp/client.gen.go" testdata/ofrep-policy.yaml
          if grep -Eq 'EvaluateFlag|OfrepEvaluate|/ofrep/v1/evaluate/flags' "$tmp/client.gen.go"; then
            echo "Direct flag evaluation escaped the SDK generator filter" >&2
            exit 1
          fi
          grep -q 'func (c \*ClientWithResponses) GetFeatureFlagsWithResponse(' "$tmp/client.gen.go"
          grep -q 'type InvoiceHandoff struct' "$tmp/client.gen.go"
          go test "$tmp/client.gen.go"

      - name: Verify official OpenFeature/OFREP example
        working-directory: examples/openfeature
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race -shuffle=on -cover ./...
          go vet ./...
          go build -o /dev/null .
