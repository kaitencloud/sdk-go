package: gen
generate:
  client: true
  models: true
output: internal/gen/client.gen.go
# Required. Without it, schemas reachable only from webhook definitions
# (Deployment, FeatureFlagEvaluated, SystemTokenIssuance, ...) are pruned as
# "unused" while the webhook body types that reference them are still emitted,
# and the generated package does not compile.
output-options:
  skip-prune: true
  # Evaluation belongs to OpenFeature and its official OFREP provider. Exact
  # operation IDs from the Core contract; management and webhook APIs stay.
  exclude-operation-ids:
    - evaluateFlag
    - evaluateFlagsBulk
  overlay:
    path: oapi-codegen.overlay.yaml
